<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="adShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="6" stdDeviation="7" flood-color="#16557a" flood-opacity="0.35"/>
    </filter>
    <clipPath id="adClip"><circle cx="120" cy="120" r="110"/></clipPath>
  </defs>

  <!-- disco blu con ombra morbida -->
  <circle cx="120" cy="120" r="110" fill="#29abe2" filter="url(#adShadow)"/>

  <!-- silhouette uomo d'affari, ritagliata nel disco -->
  <g clip-path="url(#adClip)">
    <g fill="#ffffff" filter="url(#adShadow)">
      <!-- spalle / busto -->
      <path d="M56 200 C56 164 85 144 120 144 C155 144 184 164 184 200 L184 224 L56 224 Z"/>
      <!-- testa -->
      <circle cx="120" cy="94" r="31"/>
    </g>

    <!-- scollo a V (blu) -->
    <path d="M104 145 L120 166 L136 145 Z" fill="#29abe2"/>

    <!-- cravatta -->
    <path d="M113 150 L127 150 L124 161 L116 161 Z" fill="#ffffff" stroke="#29abe2" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M116 161 L124 161 L129 196 L120 203 L111 196 Z" fill="#ffffff" stroke="#29abe2" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
</svg>
