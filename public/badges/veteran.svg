<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="tBg" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#2e1f12"/>
      <stop offset="100%" stop-color="#130b04"/>
    </radialGradient>
    <linearGradient id="tBronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c08a"/>
      <stop offset="40%" stop-color="#c9863f"/>
      <stop offset="100%" stop-color="#7a4a1c"/>
    </linearGradient>
    <linearGradient id="tBronzeD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a86c30"/>
      <stop offset="100%" stop-color="#5a3614"/>
    </linearGradient>
    <radialGradient id="tDisc" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#e8b87a"/>
      <stop offset="50%" stop-color="#b0762e"/>
      <stop offset="100%" stop-color="#6e4218"/>
    </radialGradient>
    <linearGradient id="tBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5e3a"/>
      <stop offset="50%" stop-color="#d8b24a"/>
      <stop offset="100%" stop-color="#7a2a2a"/>
    </linearGradient>
    <filter id="tSh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#140b03" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="116" fill="url(#tBg)"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#8a5e2e" stroke-opacity="0.4" stroke-width="2"/>

  <!-- top bar pin -->
  <rect x="84" y="50" width="72" height="18" rx="4" fill="url(#tBronze)" filter="url(#tSh)"/>
  <rect x="84" y="50" width="72" height="7" rx="3" fill="#ffffff" opacity="0.25"/>

  <!-- striped band -->
  <path d="M88 68 H152 L146 116 H94 Z" fill="url(#tBand)" filter="url(#tSh)"/>
  <g fill="#000000" opacity="0.12">
    <rect x="100" y="68" width="5" height="48"/>
    <rect x="118" y="68" width="5" height="48"/>
    <rect x="136" y="68" width="5" height="48"/>
  </g>

  <!-- starburst behind disc -->
  <g fill="url(#tBronzeD)" filter="url(#tSh)">
    <g id="ray"><path d="M120 96 l9 0 -9 30 -9 -30 z" transform="translate(0,52)"/></g>
    <use href="#ray" transform="rotate(40 120 152)"/>
    <use href="#ray" transform="rotate(80 120 152)"/>
    <use href="#ray" transform="rotate(120 120 152)"/>
    <use href="#ray" transform="rotate(160 120 152)"/>
    <use href="#ray" transform="rotate(200 120 152)"/>
    <use href="#ray" transform="rotate(240 120 152)"/>
    <use href="#ray" transform="rotate(280 120 152)"/>
    <use href="#ray" transform="rotate(320 120 152)"/>
  </g>

  <!-- medal disc -->
  <circle cx="120" cy="152" r="42" fill="url(#tDisc)" filter="url(#tSh)"/>
  <circle cx="120" cy="152" r="42" fill="none" stroke="#5a3614" stroke-width="2"/>
  <circle cx="120" cy="152" r="34" fill="none" stroke="#f0c08a" stroke-opacity="0.5" stroke-width="2"/>

  <!-- chevrons (service stripes) -->
  <g fill="none" stroke="#4a2c10" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 152 L120 138 L136 152"/>
    <path d="M104 166 L120 152 L136 166"/>
  </g>
  <g fill="none" stroke="#ffe2b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <path d="M104 150 L120 136 L136 150"/>
    <path d="M104 164 L120 150 L136 164"/>
  </g>

  <!-- sparkle -->
  <path d="M170 96 l3 6 6 3 -6 3 -3 6 -3 -6 -6 -3 6 -3 z" fill="#f5d8a8" opacity="0.85"/>
</svg>
