<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fBg" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#3a2a08"/>
      <stop offset="100%" stop-color="#160f02"/>
    </radialGradient>
    <linearGradient id="fGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="35%" stop-color="#ffd24d"/>
      <stop offset="70%" stop-color="#e09b1a"/>
      <stop offset="100%" stop-color="#9c6406"/>
    </linearGradient>
    <linearGradient id="fGoldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c98e14"/>
      <stop offset="100%" stop-color="#6e4503"/>
    </linearGradient>
    <linearGradient id="fBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#b87b0a"/>
    </linearGradient>
    <radialGradient id="fGem" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff9bd0"/>
      <stop offset="50%" stop-color="#e0286f"/>
      <stop offset="100%" stop-color="#8c0f3e"/>
    </radialGradient>
    <radialGradient id="fGemB" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#a0e4ff"/>
      <stop offset="50%" stop-color="#2a9be0"/>
      <stop offset="100%" stop-color="#0d4f8c"/>
    </radialGradient>
    <filter id="fSh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1a0f00" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="116" fill="url(#fBg)"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#8a6512" stroke-opacity="0.4" stroke-width="2"/>

  <!-- crown back depth -->
  <path d="M58 102 L84 150 L120 116 L156 150 L182 102 L172 174 H68 Z"
        transform="translate(0,6)" fill="url(#fGoldDark)"/>
  <!-- crown body -->
  <path d="M58 102 L84 150 L120 116 L156 150 L182 102 L172 174 H68 Z"
        fill="url(#fGold)" filter="url(#fSh)"/>
  <!-- crown highlight facets -->
  <path d="M58 102 L84 150 L120 116 Z" fill="#ffffff" opacity="0.18"/>
  <path d="M156 150 L182 102 L120 116 Z" fill="#000000" opacity="0.12"/>

  <!-- base band -->
  <rect x="64" y="174" width="112" height="26" rx="6" fill="url(#fBand)" filter="url(#fSh)"/>
  <rect x="64" y="174" width="112" height="9" rx="4" fill="#ffffff" opacity="0.3"/>

  <!-- spire tips -->
  <circle cx="58" cy="102" r="9" fill="url(#fGold)" stroke="#7a4f04" stroke-width="1.5"/>
  <circle cx="120" cy="116" r="9" fill="url(#fGold)" stroke="#7a4f04" stroke-width="1.5"/>
  <circle cx="182" cy="102" r="9" fill="url(#fGold)" stroke="#7a4f04" stroke-width="1.5"/>

  <!-- center gem -->
  <ellipse cx="120" cy="160" rx="13" ry="15" fill="url(#fGem)" stroke="#5e0a2a" stroke-width="1.5"/>
  <ellipse cx="116" cy="154" rx="4" ry="5" fill="#ffffff" opacity="0.7"/>
  <!-- side gems -->
  <circle cx="88" cy="187" r="6" fill="url(#fGemB)" stroke="#0a3a66" stroke-width="1"/>
  <circle cx="152" cy="187" r="6" fill="url(#fGemB)" stroke="#0a3a66" stroke-width="1"/>

  <!-- sparkles -->
  <path d="M170 70 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#fff7d6" opacity="0.9"/>
</svg>
