<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bBg" cx="32%" cy="28%" r="88%">
      <stop offset="0%" stop-color="#1c2433"/>
      <stop offset="100%" stop-color="#080b12"/>
    </radialGradient>
    <radialGradient id="bBall" cx="36%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e6ebf0"/>
      <stop offset="100%" stop-color="#9aa4b0"/>
    </radialGradient>
    <radialGradient id="bShade" cx="50%" cy="50%" r="55%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a2230" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="bStreak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a1e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff8a3d" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="bSh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-3" dy="6" stdDeviation="5" flood-color="#05080d" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="116" fill="url(#bBg)"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#3a4658" stroke-opacity="0.4" stroke-width="2"/>

  <!-- speed streaks -->
  <g stroke-linecap="round">
    <line x1="40" y1="96" x2="92" y2="96" stroke="url(#bStreak)" stroke-width="7"/>
    <line x1="34" y1="120" x2="84" y2="120" stroke="url(#bStreak)" stroke-width="9"/>
    <line x1="40" y1="146" x2="92" y2="146" stroke="url(#bStreak)" stroke-width="7"/>
  </g>

  <!-- ball -->
  <g filter="url(#bSh)" transform="translate(8,0)">
    <circle cx="124" cy="120" r="58" fill="url(#bBall)"/>
    <!-- pentagons / panels -->
    <g fill="#1f2733">
      <path d="M124 96 l20 14 -8 24 -24 0 -8 -24 z"/>
      <path d="M124 62 l10 8 -6 14 -8 0 -6 -14 z"/>
      <path d="M170 110 l4 12 -10 8 -8 -8 z"/>
      <path d="M78 110 l12 4 0 14 -10 0 z"/>
      <path d="M104 162 l6 12 12 -2 -2 -12 z"/>
      <path d="M150 162 l-4 10 8 6 8 -10 z"/>
    </g>
    <!-- seams -->
    <g fill="none" stroke="#2a3340" stroke-width="2.5">
      <path d="M144 110 l16 6 M104 110 l-16 6 M132 134 l8 18 M116 134 l-8 18 M124 96 l0 -16"/>
    </g>
    <!-- shading + gloss -->
    <circle cx="124" cy="120" r="58" fill="url(#bShade)"/>
    <ellipse cx="104" cy="98" rx="18" ry="12" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>
