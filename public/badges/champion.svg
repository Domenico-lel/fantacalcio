<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cBg" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#3a2c08"/>
      <stop offset="100%" stop-color="#161002"/>
    </radialGradient>
    <linearGradient id="cCup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="30%" stop-color="#ffd34d"/>
      <stop offset="65%" stop-color="#e3a01c"/>
      <stop offset="100%" stop-color="#9c6406"/>
    </linearGradient>
    <linearGradient id="cCupShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#9c6406"/>
    </linearGradient>
    <radialGradient id="cStar" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fffbe0"/>
      <stop offset="100%" stop-color="#e0a020"/>
    </radialGradient>
    <filter id="cSh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1a1000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="116" fill="url(#cBg)"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#8a6512" stroke-opacity="0.4" stroke-width="2"/>

  <!-- handles -->
  <path d="M82 78 C50 78 50 124 86 124" fill="none" stroke="url(#cCup)" stroke-width="11" filter="url(#cSh)"/>
  <path d="M158 78 C190 78 190 124 154 124" fill="none" stroke="url(#cCup)" stroke-width="11" filter="url(#cSh)"/>

  <!-- cup body -->
  <path d="M78 66 H162 V96 C162 134 144 156 120 156 C96 156 78 134 78 96 Z"
        fill="url(#cCup)" filter="url(#cSh)"/>
  <path d="M78 66 H162 V96 C162 134 144 156 120 156 C96 156 78 134 78 96 Z"
        fill="url(#cCupShine)"/>
  <!-- rim -->
  <rect x="72" y="60" width="96" height="12" rx="5" fill="url(#cBase)" filter="url(#cSh)"/>
  <rect x="72" y="60" width="96" height="5" rx="2.5" fill="#ffffff" opacity="0.35"/>

  <!-- stem -->
  <rect x="112" y="156" width="16" height="22" fill="url(#cCup)"/>
  <!-- base tiers -->
  <rect x="96" y="178" width="48" height="12" rx="4" fill="url(#cBase)" filter="url(#cSh)"/>
  <rect x="82" y="190" width="76" height="16" rx="5" fill="url(#cBase)" filter="url(#cSh)"/>
  <rect x="82" y="190" width="76" height="6" rx="3" fill="#ffffff" opacity="0.3"/>

  <!-- star emblem -->
  <path d="M120 84 l6 14 15 1 -11 10 4 15 -14 -8 -14 8 4 -15 -11 -10 15 -1 z"
        fill="url(#cStar)" stroke="#b87b0a" stroke-width="1.5"/>
  <!-- sparkle -->
  <path d="M168 50 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#fff7d6" opacity="0.9"/>
</svg>
