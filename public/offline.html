<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <title>Offline · Fanta Soccer Club</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 28px;
        color: #f4f7fd; background:
          radial-gradient(80% 45% at 50% 0%, rgba(45,110,220,.28), transparent 65%),
          radial-gradient(75% 40% at 50% 100%, rgba(16,185,129,.2), transparent 62%), #070b14;
      }
      main { width: min(100%, 390px); text-align: center; }
      img { width: 92px; height: 92px; border-radius: 24px; box-shadow: 0 18px 50px rgba(0,0,0,.45); }
      h1 { margin: 24px 0 8px; font-size: 26px; letter-spacing: -.02em; }
      p { margin: 0 auto; max-width: 320px; color: rgba(214,226,248,.7); line-height: 1.55; }
      button {
        width: 100%; min-height: 52px; margin-top: 26px; border: 0; border-radius: 16px;
        color: #04281e; background: linear-gradient(135deg,#0ec98f,#4ae8b8);
        font: inherit; font-weight: 800; cursor: pointer;
      }
      small { display: block; margin-top: 16px; color: rgba(214,226,248,.42); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Sei fuori gioco… per ora</h1>
      <p>Non c’è connessione. Appena torni online, riprova e la lega ricomincia a girare.</p>
      <button type="button" onclick="location.reload()">Riprova</button>
      <small>Fanta Soccer Club</small>
    </main>
  </body>
</html>
